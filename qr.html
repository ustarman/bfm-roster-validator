<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="assets/auspost-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BFM Roster Validator — QR code</title>
    <style>
      :root {
        --ap-red: #e11b22;
        --ap-red-gradient: linear-gradient(150deg, #e11b22 0%, #e11b22 55%, #e4451e 100%);
        --page-bg: #f4f4f4;
        --card-bg: #ffffff;
        --card-border: #e6e6e6;
        --text: #1d1d1d;
        --subtext: #6b6b6b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page-bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      header {
        position: relative;
        background: var(--ap-red-gradient);
        color: #fff;
        padding: 20px 24px 62px;
        text-align: center;
      }
      .app-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .logo-chip {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        overflow: hidden;
        background: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      .logo-chip img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .app-bar h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      header p {
        margin: 10px 0 0;
        font-size: 22px;
        font-weight: 700;
      }
      .swoosh {
        position: absolute;
        bottom: -1px;
        left: 0;
        width: 100%;
        height: 56px;
        display: block;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 20px 40px;
        margin-top: -34px;
      }
      .card {
        background: var(--card-bg);
        border: 0.5px solid var(--card-border);
        border-radius: 20px;
        padding: 32px;
        max-width: 380px;
        width: 100%;
        text-align: center;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
      }
      .card svg {
        width: 240px;
        height: 240px;
        display: block;
        margin: 0 auto 20px;
        border: 1px solid var(--card-border);
        border-radius: 12px;
      }
      .card p.caption {
        margin: 0 0 14px;
        font-size: 14px;
        color: var(--subtext);
      }
      .url-box {
        display: inline-block;
        padding: 10px 16px;
        background: #fafafa;
        border: 0.5px solid var(--card-border);
        border-radius: 10px;
        font-size: 13px;
        word-break: break-all;
      }
      .url-box a {
        color: var(--ap-red);
        text-decoration: none;
        font-weight: 600;
      }
      .download-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 18px;
        padding: 11px 20px;
        background: var(--ap-red);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      .download-btn:active {
        background: #c5161c;
      }
      footer {
        text-align: center;
        padding: 14px;
        font-size: 12px;
        color: var(--subtext);
      }
      @media print {
        header,
        footer {
          display: none;
        }
        body {
          background: #fff;
        }
        main {
          margin-top: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="app-bar">
        <span class="logo-chip"><img src="assets/auspost-logo.jpg" alt="Australia Post" /></span>
        <h1>BFM Roster Validator</h1>
      </div>
      <p>Scan to open</p>
      <svg class="swoosh" viewBox="0 0 330 56" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,56 L0,14 C95,40 210,52 330,44 L330,56 Z" fill="var(--page-bg)" />
      </svg>
    </header>
    <main>
      <div class="card">

M6 30.5h1m2 0h2m1 0h1m1 0h2m1 0h1m2 0h1m1 0h1m1 0h2m3 0h2m3 0h1m3 0h2m2 0h3M5 31.5h1m3 0h1m3 0h1m1 0h2m1 0h1m1 0h3m1 0h2m5 0h1m1 0h2m1 0h1m3 0h1M4 32.5h2m3 0h2m1 0h3m4 0h1m4 0h2m1 0h1m1 0h1m3 0h1m1 0h2m1 0h1m2 0h1m2 0h1M5 33.5h1m1 0h1m7 0h2m1 0h1m1 0h1m4 0h3m3 0h1m1 0h1m1 0h2m5 0h3M4 34.5h1m1 0h1m1 0h1m1 0h4m2 0h2m1 0h1m1 0h1m1 0h3m3 0h1m4 0h3m2 0h1m3 0h2M5 35.5h1m2 0h1m2 0h2m1 0h1m1 0h2m2 0h1m1 0h2m1 0h2m1 0h4m1 0h2m1 0h3m4 0h2M4 36.5h1m1 0h3m1 0h1m6 0h1m9 0h1m4 0h2m1 0h6m2 0h2M12 37.5h2m3 0h2m4 0h1m6 0h1m1 0h1m3 0h1m3 0h2m1 0h2M4 38.5h7m3 0h1m1 0h2m6 0h2m6 0h2m1 0h2m1 0h1m1 0h1m2 0h2M4 39.5h1m5 0h1m1 0h1m1 0h1m2 0h3m1 0h1m3 0h1m2 0h5m3 0h1m3 0h1M4 40.5h1m1 0h3m1 0h1m1 0h3m1 0h1m2 0h2m1 0h1m1 0h1m4 0h4m3 0h5m2 0h1M4 41.5h1m1 0h3m1 0h1m2 0h4m1 0h1m2 0h2m6 0h1m3 0h1m3 0h1m2 0h2m2 0h1M4 42.5h1m1 0h3m1 0h1m1 0h2m2 0h1m2 0h2m1 0h2m1 0h1m1 0h1m7 0h2m2 0h2m3 0h1M4 43.5h1m5 0h1m2 0h2m1 0h2m5 0h1m3 0h3m2 0h2m2 0h4m1 0h1m1 0h1M4 44.5h7m5 0h1m4 0h4m2 0h1m1 0h5m1 0h2m1 0h3m2 0h2"/></svg>
        <p class="caption">Point your phone's camera at this code, or use the link below.</p>
        <div class="url-box">
          <a href="https://ustarman.github.io/bfm-roster-validator/">ustarman.github.io/bfm-roster-validator</a>
        </div>
        <br />
        <a id="downloadBtn" class="download-btn" href="bfm-roster-validator-qr.png" download="BFM-Roster-Validator-QR.png">
          ⬇ Download QR code
        </a>
      </div>
    </main>
    <footer>Australia Post — internal roster tool</footer>
    <script>
      // Composes the whole branded card (logo, headline, QR, link) into one
      // PNG so the download is a shareable image, not just the bare QR matrix.
      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = src;
        });
      }

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      async function buildShareImage() {
        const W = 640;
        const headerH = 170;
        const cardW = 520;
        const cardX = (W - cardW) / 2;
        const cardY = headerH - 40;
        const qrSize = 340;
        const padTop = 40;
        const cardH = padTop + qrSize + 30 + 44 + 24 + 50 + 40;
        const H = cardY + cardH + 60;

        const canvas = document.createElement('canvas');
        const scale = 2; // export at 2x for a crisp print/email image
        canvas.width = W * scale;
        canvas.height = H * scale;
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);
        ctx.textBaseline = 'middle';

        ctx.fillStyle = '#F4F4F4';
        ctx.fillRect(0, 0, W, H);

        const grad = ctx.createLinearGradient(0, 0, W, headerH);
        grad.addColorStop(0, '#E11B22');
        grad.addColorStop(0.55, '#E11B22');
        grad.addColorStop(1, '#E4451E');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, headerH);

        // swoosh — asymmetric concave sweep cut out of the header's bottom edge
        ctx.beginPath();
        ctx.moveTo(0, headerH);
        ctx.lineTo(0, headerH - 28);
        ctx.bezierCurveTo(W * 0.29, headerH - 2, W * 0.64, headerH - 12, W, headerH - 22);
        ctx.lineTo(W, headerH);
        ctx.closePath();
        ctx.fillStyle = '#F4F4F4';
        ctx.fill();

        const logoImg = await loadImage('assets/auspost-logo.jpg');
        const chipR = 17;
        const chipX = W / 2 - 92;
        const chipY = 42;
        ctx.save();
        ctx.beginPath();
        ctx.arc(chipX, chipY, chipR, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.clip();
        ctx.drawImage(logoImg, chipX - chipR, chipY - chipR, chipR * 2, chipR * 2);
        ctx.restore();

        ctx.fillStyle = '#fff';
        ctx.font = '600 18px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('BFM Roster Validator', chipX + chipR + 10, chipY);

        ctx.textAlign = 'center';
        ctx.font = '700 30px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText('Scan to open', W / 2, 100);

        roundRect(ctx, cardX, cardY, cardW, cardH, 20);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.strokeStyle = '#E6E6E6';
        ctx.lineWidth = 1;
        ctx.stroke();

        const qrImg = await loadImage('bfm-roster-validator-qr.png');
        const qrX = cardX + (cardW - qrSize) / 2;
        const qrY = cardY + padTop;
        ctx.strokeStyle = '#E6E6E6';
        ctx.strokeRect(qrX - 1, qrY - 1, qrSize + 2, qrSize + 2);
        ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);

        let y = qrY + qrSize + 30;
        ctx.fillStyle = '#6B6B6B';
        ctx.font = '400 15px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText("Point your phone's camera at this code,", W / 2, y);
        ctx.fillText('or use the link below.', W / 2, y + 22);

        y += 22 + 38;
        const urlText = 'ustarman.github.io/bfm-roster-validator';
        ctx.font = '600 15px -apple-system, BlinkMacSystemFont, sans-serif';
        const urlW = ctx.measureText(urlText).width + 40;
        roundRect(ctx, W / 2 - urlW / 2, y - 22, urlW, 44, 10);
        ctx.fillStyle = '#FAFAFA';
        ctx.fill();
        ctx.strokeStyle = '#E6E6E6';
        ctx.stroke();
        ctx.fillStyle = '#E11B22';
        ctx.fillText(urlText, W / 2, y);

        ctx.fillStyle = '#6B6B6B';
        ctx.font = '400 13px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText('Australia Post — internal roster tool', W / 2, H - 24);

        return canvas;
      }

      const downloadBtn = document.getElementById('downloadBtn');
      downloadBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        const original = downloadBtn.textContent;
        downloadBtn.textContent = 'Preparing…';
        try {
          const canvas = await buildShareImage();
          canvas.toBlob((blob) => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'BFM-Roster-Validator-QR.png';
            a.click();
            URL.revokeObjectURL(url);
          }, 'image/png');
        } finally {
          downloadBtn.textContent = original;
        }
      });
    </script>
  </body>
</html>
